[project]
name = "pin2brand"
version = "0.2.0"
description = "Pinterest & Moodboard Visual Identity Compiler for Front-End Coding Agents and Generative AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "pinterest",
    "design-tokens",
    "mcp",
    "coding-agents",
    "visual-identity",
    "cielab",
    "tailwind",
    "midjourney",
    "cursor-rules",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "lxml>=5.3.0",
    "mcp>=1.2.0",
    "numpy>=2.0.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.48.0",
]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
pin2brand = "pin2brand.cli:app"
pin2brand-mcp = "pin2brand.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pin2brand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
